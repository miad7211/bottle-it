<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lock it in 🔒</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Bottle this up</h1>
      <p class="sub">Future you thanks present you. 🫙</p>
    </header>

    <section class="preview">
      <img id="preview-img" alt="" />
      <div>
        <input type="text" id="product-name" placeholder="Product name" />
        <input type="url" id="product-url" placeholder="https://..." readonly />
      </div>
    </section>

    <label class="field">
      Price (optional)
      <div class="price-row">
        <span>$</span>
        <input type="number" id="price" min="0" step="0.01" placeholder="0.00" />
      </div>
    </label>

    <label class="field">
      Why do you want this?
      <textarea id="note" rows="2" placeholder="saw on 小红书... too tempting"></textarea>
    </label>

    <fieldset class="duration">
      <legend>How long should it sit?</legend>
      <label><input type="radio" name="duration" value="3" /> 3 days</label>
      <label><input type="radio" name="duration" value="5" /> 5 days</label>
      <label><input type="radio" name="duration" value="7" checked /> 7 days</label>
      <label><input type="radio" name="duration" value="14" /> 14 days</label>
      <label class="custom">
        <input type="radio" name="duration" value="custom" />
        custom: <input type="number" id="custom-days" min="1" max="365" placeholder="days" />
      </label>
    </fieldset>

    <div class="actions">
      <button id="cancel-btn" class="secondary">Cancel</button>
      <button id="lock-btn" class="primary">Bottle it 🫙</button>
    </div>
  </main>
  <script type="module" src="lock.js"></script>
</body>
</html>
